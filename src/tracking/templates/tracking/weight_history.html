{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitacoraFit | Weight History</title>
    {% tailwind_css %}
</head>
<body>
    <main>
        <h1>Weight History</h1>
        {% for entry in weight_entries %}
            <article>
                <p>Date: {{ entry.date }}</p>
                <p>Weight: {{ entry.weight }} lbs</p>
                <p>Notes: {{ entry.notes | default:"No notes" }}</p>
            </article>
        {% empty %}
            <p>No weight entries found.</p>
        {% endfor %}
    </main>
</body>
</html>
